; Forja SX2 - huellas de dibujo: efectos que Forja reconoce por cómo se dibujan, no por dónde están en la memoria.
; Cada [sección] es una huella. Forja la ofrece como parche (L3+R3 > Extras > Parche, al final de la lista) en los juegos
; que nombra y en cualquier juego en el que gaste "ofrecer_desde" % o más del GS. El jugador la prende o la apaga, y queda
; guardado para ese juego. Este archivo también llega por el centro de ajustes (el GitHub del proyecto) sin un PKG nuevo.
;
; Claves:
;   nombre, descripcion   lo que ve el jugador
;   juegos                seriales (SLUS-21678) o ganchos de la base de datos de juegos (OI_DBZBTGames), con comas
;   ofrecer_desde         % del tiempo del GS desde el que se ofrece en cualquier juego (de fábrica 15)
;   destino               pantalla (la imagen que se ve) / fuera (otra imagen: brillos, sombras, reflejos)
;   textura               no / si / T4 / T8 / T8H / T4HL / T4HH / C32 / C24 / C16 / C16S / Z32 / Z24 / Z16 / Z16S
;   funcion               modulate / decal / highlight / highlight2 (cómo se mezcla la textura con el color)
;   mezcla                si / no (transparencia)
;   ecuacion              hasta 4 mezclas "ABCD" (cifras 0-2, como el registro ALPHA del GS), con comas
;   primitiva             puntos / lineas / triangulos / sprites
;   escribe_z             si / no (si el dibujo escribe la profundidad)
;   tamano                ancho x alto de la textura (256x256)
; Las que no se ponen valen cualquiera. Comentarios solo en su propia línea.

[sombreado_personajes]
nombre = Menos efectos: sombreado de personajes
descripcion = Quita las sombras y brillos de ropa y personajes: menos detalle, mucha más velocidad (Dragon Ball: ~45 a ~85 %)
; Medido el 2026-10-18 en Dragon Ball Z Budokai Tenkaichi 4 (mod del 3, PS4 Pro): ~12.000 dibujos por segundo y 30-50 % del
; GS en las peleas; sin ellos, 80-92 % de velocidad y 25-30 cuadros por segundo en vez de ~45 % y 13-14, con menos detalle
; en la ropa. OI_DBZBTGames es el motor de Spike de los Budokai Tenkaichi 2, 3 y el mod 4, en todas sus regiones.
juegos = OI_DBZBTGames
ofrecer_desde = 15
destino = pantalla
textura = T8
funcion = decal
mezcla = si
primitiva = triangulos

[pasadas_pantalla]
nombre = Menos efectos: pasadas de pantalla (experimental)
descripcion = Quita efectos que el juego dibuja en imágenes aparte (brillos, desenfoques, reflejos). Si falta algo importante, apágalo
; Experimental (compilación 56): sin probar en un juego donde pese. Son rectángulos con mezcla que leen otra imagen del juego
; (textura de color de 32 bits) y se dibujan fuera de la pantalla: así se hacen los brillos y desenfoques de muchos juegos.
; Solo se ofrece donde se lleve 20 % o más del GS. En Dragon Ball (03f00 <-> 03ec0, 64x64) costaban 4-8 % y no se veía cambio.
; RETIRADA el 2026-10-21 (ofrecer_desde = 100: ya no se ofrece en ningún juego; quien la tenga prendida la sigue viendo en
; L3+R3 > Extras y la puede apagar). En Dragon Ball esas dos imágenes de 64x64 son su cadena de brillo y color, que el juego
; vuelve a leer: sin ellas salían cubos morados y negros, líneas por todos lados y el personaje medio transparente, y el GS
; siguió en 86-87 %, sin ganar nada. Quitar dibujos cuyo resultado el juego vuelve a leer rompe la imagen.
ofrecer_desde = 100
destino = fuera
textura = C32
mezcla = si
primitiva = sprites
