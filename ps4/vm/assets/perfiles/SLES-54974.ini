; Forja SX2 - perfil de fábrica: Guitar Hero III: Legends of Rock (PAL, SLES-54974).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77). Lo que cambies en L3+R3 le gana a este
; archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Este juego todavía no va completo en la PS4: en las canciones va al 33-47 % de velocidad, con el EE y el GS los dos a más
; del doble de su tiempo (sus dibujos que leen búferes como textura de 8 bits cuestan ~1-2 ms cada uno). Los menús van al
; 100 %.

[EmuCore/Speedhacks]
; CPU de la PS2 al 31 % (lo medido).
EECycleRate = -5

[Forja]
; Generación de cuadros apagada: en un juego de ritmo, el cuadro generado suma un poco de retraso entre el botón y la
; imagen, y en las canciones el juego va lento y la generación se pausa o se apaga sola.
FrameGen = 0
; Saltar cuadros apagado: el juego dibuja en búferes aparte y lo que más frena es el EE.
SaltarCuadros = 0
; Modo video Auto: los fondos de los menús son videos (al 88-95 % con el EE al tope).
VideoMode = 2
