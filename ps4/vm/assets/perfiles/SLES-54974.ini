; Forja SX2 - perfil de fábrica: Guitar Hero III: Legends of Rock (PAL, SLES-54974).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77) y el 2026-10-24 (compilación 81). Lo que
; cambies en L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Lo que más lo frenaba es el público: la base de datos de PCSX2 (GSC_GuitarHero) lo dibuja por software, en la CPU, y eso
; era ~70 % del GS (36 ms por cuadro, las canciones al 40 %). Dibujado en la gráfica iba al 81 %, pero el público salía roto.

[EmuCore/GS]
; Desentrelazado en mezcla (compilación 104). Lo normal (Auto, adaptativo) hace parpadear los fondos y la guitarra. Joseph, 2026-10-31: "ya no
; parpadea casi nada"; también se ve un poco más suave: se cambia en L3+R3 > Imagen.
deinterlace_mode = 6

[EmuCore/Speedhacks]
; CPU de la PS2 al 27 % (compilación 97; antes 31 %). Con la 96 el público ya cuesta poco y lo que frena es el EE: en una
; canción al 31 % y 1 de 8 (2026-10-30, F-A043) la velocidad fue 87 %, el EE frenó el 72 % del tiempo y le faltaba ser 16 %
; más barato. Medido al 27 % (compilación 97, F-0FF4): 93 % de velocidad, y le falta ser 11 % más barato.
EECycleRate = -6
; Salto de ciclo en 1/2 (compilación 102). Medido el 2026-10-31 en una PS4 Pro con Boost, CPU 27 %, 1 de 8 (velocidad, FPS, cuadros dobles):
; sin salto ~88 %, ~44 FPS, ~1 %; 1/4 98,6 %, 47,8 FPS, 3 %; 1/2 99,5 %, 45,6 FPS, 8 %; 3/4 100 %, 43,9 FPS, 12 %; 1 100 %, 41 FPS, 18 %.
; En una PS4 normal o Slim sin medir: si va lento, súbelo en L3+R3 > Rendimiento.
EECycleSkip = 0
EECycleSkipQuarters = 2

[Forja]
; Compilación 82: el público por software 1 de cada N cuadros (en los otros queda el anterior). Medido el 2026-10-24 con la
; CPU de la PS2 al 31 %: todos 40 %, 1 de 2 56 %, 1 de 4 73 %, 1 de 8 86 % (43 cuadros por segundo). 1 de 8 desde la 83,
; que además deja de pixelarlo. 1 = todos (como PCSX2), 2, 4 u 8.
PublicoCada = 8
; Generación de cuadros apagada: en un juego de ritmo, el cuadro generado suma un poco de retraso entre el botón y la
; imagen, y en las canciones el juego va lento y la generación se pausa o se apaga sola.
FrameGen = 0
; Saltar cuadros apagado: el juego dibuja en búferes aparte y Saltar cuadros solo deja afuera lo que va a la pantalla.
SaltarCuadros = 0
; Modo video Auto: los fondos de los menús son videos (al 88-95 % con el EE al tope).
VideoMode = 2
