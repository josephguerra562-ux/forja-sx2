; Forja SX2 - perfil de fábrica: Guitar Hero III: Legends of Rock (PAL, SLES-54974).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77) y el 2026-10-24 (compilación 81). Lo que
; cambies en L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Lo que más lo frenaba es el público: la base de datos de PCSX2 (GSC_GuitarHero) lo dibuja por software, en la CPU, y eso
; era ~70 % del GS (36 ms por cuadro, las canciones al 40 %). Dibujado en la gráfica iba al 81 %, pero el público salía roto.

[EmuCore/GS]
; Desentrelazado en mezcla (compilación 104). Lo normal (Auto, adaptativo) hace parpadear los fondos y la guitarra. Joseph, 2026-10-31: "ya no
; parpadea casi nada"; también se ve un poco más suave: se cambia en L3+R3 > Imagen.
deinterlace_mode = 6

; CPU de la PS2 y salto de ciclo: los de la base (compilación 146). Antes: CPU al 27 % y salto fijo en 1/2 (compilaciones 97 y 102: 99,5 %,
; 45,6 FPS). Con la CPU al 100 %, el CPU automático y el salto "Al vuelo" (la 143, 2026-11-18): 100 % de velocidad y 50 FPS, lo mejor medido.

[EmuCore/CPU/Recompiler]
; La protección del VU1 de vuelta (compilación 146; "VU1 rápido" la quita en todos los juegos desde la 127). Joseph, 2026-11-18: "parpadea
; el mango de la guitarra, a veces el público, a veces el cantante ... según cómo se muestra la cámara": lo que se ve cuando el VU1 calcula
; sin protección y algunos puntos se van al infinito desde ciertos ángulos. La base de datos de PCSX2 marca este juego como delicado con
; el VU1 (vu1RoundMode 0). Al VU1 le sobra: 45 % ocupado en las canciones.
vu1Overflow = true
; La 145 en la app: con la protección del VU1 siguió parpadeando (Joseph, 2026-11-18: "el mango, los personajes, el césped o las
; personas, muy aleatorio"), así que no era el VU1. Lo que parpadea al azar, cada vez algo distinto, es lo que hace un dibujo que a veces
; se pierde: "Grabar dibujos en otro hilo" arma los dibujos en paralelo. Apagado en este juego (el GS de Guitar Hero está al 7 %).

[Forja]
GrabarEnOtroHilo = 0
; Compilación 82: el público por software 1 de cada N cuadros (en los otros queda el anterior). Medido el 2026-10-24 con la
; CPU de la PS2 al 31 %: todos 40 %, 1 de 2 56 %, 1 de 4 73 %, 1 de 8 86 % (43 cuadros por segundo). 1 de 8 desde la 83,
; que además deja de pixelarlo. 1 = todos (como PCSX2), 2, 4 u 8.
PublicoCada = 8
; Generación de cuadros apagada: en un juego de ritmo, el cuadro generado suma un poco de retraso entre el botón y la
; imagen, y en las canciones el juego va lento y la generación se pausa o se apaga sola.
FrameGen = 0
; Saltar cuadros apagado: el juego dibuja en búferes aparte y Saltar cuadros solo deja afuera lo que va a la pantalla.
; Base (la 145 en la app): quitado "SaltarCuadros = 0"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)
; Modo video Auto: los fondos de los menús son videos (al 88-95 % con el EE al tope).
VideoMode = 2
; 2026-11-08 (124-126, una hora en 7 juegos): "Revisión rápida del código" sin un error (Downhill 60 min seguidos).
