; Forja SX2 - perfil de fábrica: Guitar Hero III: Legends of Rock (PAL, SLES-54974).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77) y el 2026-10-24 (compilación 81). Lo que
; cambies en L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Lo que más lo frenaba es el público: la base de datos de PCSX2 (GSC_GuitarHero) lo dibuja por software, en la CPU, y eso
; era ~70 % del GS (36 ms por cuadro, las canciones al 40 %). Dibujado en la gráfica iba al 81 %, pero el público salía roto.

[EmuCore/Speedhacks]
; CPU de la PS2 al 27 % (compilación 97; antes 31 %). Con la 96 el público ya cuesta poco y lo que frena es el EE: en una
; canción al 31 % y 1 de 8 (2026-10-30, F-A043) la velocidad fue 87 %, el EE frenó el 72 % del tiempo y le faltaba ser 16 %
; más barato. Medido al 27 % (compilación 97, F-0FF4): 93 % de velocidad, y le falta ser 11 % más barato.
