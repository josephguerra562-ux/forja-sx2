; Forja SX2 - perfil de fábrica: Need for Speed Most Wanted (PAL, SLES-53559).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77). Lo que cambies en L3+R3 le gana a este
; archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; CPU de la PS2 al 31 %: en carrera, 84-104 % de velocidad (mediana 92-94 %) a ~18 cuadros, con el EE y el GS los dos cerca
; del tope.
EECycleRate = -5

[Forja]
; Generación de cuadros apagada: le costaba 13 puntos de velocidad (80 % con ella contra 93 % sin ella en la misma carrera)
; y se apagaba sola. Se prende en L3+R3 > Imagen.
FrameGen = 0
; Saltar cuadros: este juego dibuja directo en la pantalla, así que puede saltar cuadros. Auto entra cuando el GS es lo que
; frena y el EE tiene espacio (la parte pesada del menú, al 32 %); en carrera el EE va al tope y no entra. Las versiones
; anteriores a la 1.06 (sin el guardián) leen SaltarCuadros: para ellas, apagado.
SaltarCuadros = 0
SaltarCuadrosConGuardian = 1
; Modo video Auto.
VideoMode = 2
; 2026-11-08 (124-126, una hora en 7 juegos): "Revisión rápida del código" sin un error (Downhill 60 min seguidos).
RevisionRapida = 1
; 2026-11-13 (compilación 130): a los 4 min 33 s se prendieron "Disco sin esperas" y "CPU sin tirones" y se cargó una partida;
; 80 s después el juego saltó a una dirección sin código ("Jump to unaligned address") y quedó detenido. No se sabe cuál de las dos
; fue (ni si fue alguna). Desde la 131 las dos vienen prendidas para todos los juegos: aquí quedan apagadas hasta probarlas una por una.
; 2026-11-14 (compilación 132): sin las dos, 4 min 15 s sin trabarse, pero con 17 tirones de disco (casi 2 s de espera en total).
; Vuelve "Disco sin esperas" sola, para saber cuál de las dos era: si el juego se traba así, es ella; si no, era "CPU sin tirones".
; 2026-11-14 (compilación 135, CPU al 60-100 %): con "Disco sin esperas" sola, ~7 minutos entre dos partidas sin trabarse. Pero sin
; "CPU sin tirones" cada cambio de CPU (el CPU automático, el modo video) borra todo el código traducido: 5 reinicios y tirones de hasta
; 971 ms en 4 min 25 s. Vuelve "CPU sin tirones": si el juego se traba otra vez, es ella (y el guardián pone Modo seguro Parcial solo).
DiscoSinEsperas = 1
CpuSinTirones = 1
