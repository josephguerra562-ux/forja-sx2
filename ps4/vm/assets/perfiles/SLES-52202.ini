; Forja SX2 - perfil de fábrica: Downhill Domination (PAL, SLES-52202).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilación 75). Lo que cambies en L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; Antes: CPU de la PS2 al 31 %: en las carreras, 100 % de velocidad a 25 cuadros (los del juego) aun a 4x, con el EE al ~74 %.
; 2026-11-08 (124-126, una hora): a 31-44 % 33-36 FPS (completa el 85-94 %); a 57 % 42-45 FPS (81-84 %); a 100 % 46 FPS (70 %).
EECycleRate = -2

[Forja]
; Generación de cuadros en "Sí": el juego dibuja 25 cuadros parejos y generó el 100 % del tiempo, así que la pantalla
; muestra 50. Es el caso ideal para la generación de cuadros. Se apaga en L3+R3 > Imagen.
FrameGen = 1
; Saltar cuadros apagado: el GS va sobrado (~42 %).
SaltarCuadros = 0
; Modo video Auto.
VideoMode = 2
; 2026-11-08 (124-126, una hora en 7 juegos): "Revisión rápida del código" sin un error (Downhill 60 min seguidos).
RevisionRapida = 1
