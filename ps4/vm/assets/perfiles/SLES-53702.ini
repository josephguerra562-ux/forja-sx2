; Forja SX2 - perfil de fábrica: Resident Evil 4 (PAL, SLES-53702).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilación 75, 22 minutos). Lo que cambies en L3+R3 le gana a
; este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; CPU de la PS2 al 27 %: jugando, 100 % de velocidad a 50 cuadros los 10 minutos medidos, con el EE en 19,7 ms de 20 (justo
; en el límite). Con más CPU el EE se pasa.
EECycleRate = -6

[Forja]
; CPU automático apagado: el juego ya empieza en el 27 %, el paso más bajo.
CpuAuto = 0
; Generación de cuadros apagada: el juego ya dibuja 50 cuadros, no tiene espacio para generar, y el EE va al tope.
FrameGen = 0
; Saltar cuadros apagado: lo que frena es el EE, no el GS, y el juego dibuja en un búfer aparte.
SaltarCuadros = 0
; Modo video Auto: los videos (que son muchos en la versión de PS2) sacaban el doble de imágenes de las que necesitan al
; 50 %; desde la compilación 76 el Auto baja un paso cuando le sobran, para que vayan al 100 % de velocidad.
VideoMode = 2
