; Forja SX2 - perfil de fábrica: Mega Man X: Command Mission (USA, SLUS-20903).
; Medido en una PS4 Pro con el Modo optimizado (octubre de 2026). Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/CPU/Recompiler]
; El GameDB le pone al VU1 el clamp más caro (vu1ClampMode 3, "arregla los trofeos"). Con el clamp normal las batallas
; van a 30 FPS fijos y no se reportaron fallos. Es lo que hacía EnableGameFixes = false, sin apagar el resto del GameDB.
vu1Overflow = true
vu1ExtraOverflow = false
vu1SignOverflow = false
