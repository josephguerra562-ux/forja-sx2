; Forja SX2 - perfil de fábrica: God of War II (PAL, SCES-54206).
; Medido en una PS4 Pro con el Modo optimizado (octubre de 2026). Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; El GameDB apaga este atajo del VU1 (mvuFlag: 0) porque en PC algunos ataques salían como cuadrados. En la PS4 no se
; vieron, y con él las peleas pasaron del 51 % al 61 % de velocidad.
vuFlagHack = true
; CPU de la PS2 al 36 % (compilación 46; antes 27 %). El juego calcula su movimiento por tiempo: con más CPU dibuja más
; cuadros sin ir en cámara lenta. Medido en el Coloso el 2026-10-18 con Menos efectos 1 y 2: al 27 %, ~30 cuadros por
; segundo y 98 % de velocidad; al 36 %, ~41 cuadros y 88 %. El CPU automático (abajo) lo baja solo al 27 % en lo más pesado.
EECycleRate = -4

[Forja]
; Generación de cuadros: apagada de fábrica (compilación 59): pesa en la gráfica, más en una PS4 o una Slim, y estuvo
; encendida en los cierres de este juego del 2026-10-19. Antes: FrameGen = 2 ("Fluida", compilación 40: este juego PAL hace
; 50 cuadros y la PS4 manda la imagen a 60 Hz). Quien quiera, la enciende en L3+R3 > Imagen (compilación 61).
FrameGen = 0
; Plan B: EE, VU1 y GS en los núcleos 1, 2 y 3. En las peleas, 69 % contra 55 % con el reparto normal.
Nucleos = EE=1 VU1=2 GS=3 AUDIO=5 AYUDANTES=4
; CPU automático hasta el 27 % (compilación 46; antes apagado): si una pelea baja del 92 % de velocidad unos 3 s, baja un
; paso (36 -> 31 -> 27 %) y vuelve a subir cuando hay margen. En la 36 no servía porque el VU1 frenaba igual a cualquier
; velocidad; con los Menos efectos 1 y 2 el VU1 tiene margen y la velocidad del CPU vuelve a mandar.
CpuAuto = -6
; Modo video Auto (compilación 49): en los videos busca solo el CPU de la PS2 que hace falta. Medido el 2026-10-18: al 27 %
; los videos salían a 17-21 cuadros (al juego le faltaba CPU para decodificar) y al 60 % a 23 con el 92 % de velocidad (a la
; PS4 le faltaba); el punto justo ronda el 36 %.
VideoMode = 2

[Patches]
; Saltar cinemáticas con cualquier botón: "Skip Cutscenes", del archivo de la comunidad que Forja baja al empezar el juego.
; Menos efectos 1 y 2 (compilación 44): medidos uno por uno en el Coloso, primera fase, el 2026-10-18: con los dos, 97 % de
; velocidad aun a 3x, lo más rápido que se probó; el 3 y el 4 no sumaron más. Quitan algunos efectos visuales: se apagan en
; L3+R3 > Extras. Si tu perfil tiene su propia lista de parches, manda la tuya.
Enable = Skip Cutscenes
Enable = Menos efectos 1 (Sony)
Enable = Menos efectos 2 (Sony)
