; Forja SX2 - perfil de fábrica: God of War II (PAL, SCES-54206).
; Medido en una PS4 Pro con el Modo optimizado (octubre de 2026). Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; 2026-10-21: la configuración de Joseph con la que el juego fue al 100 % de velocidad y "súper fluido" en su PS4 Pro
; (v1.05, compilación 69, a 2x): CPU de la PS2 al 27 % fijo, generación de cuadros en "Sí", Plan B y Saltar cuadros apagado.

[EmuCore/Speedhacks]
; El GameDB apaga este atajo del VU1 (mvuFlag: 0) porque en PC algunos ataques salían como cuadrados. En la PS4 no se
; vieron, y con él las peleas pasaron del 51 % al 61 % de velocidad.
vuFlagHack = true
; CPU de la PS2 al 27 % (2026-10-21; antes 36 %). El juego calcula su movimiento por tiempo: con menos CPU dibuja menos
; cuadros, pero va a su velocidad real. Jugando el 2026-10-21 (3 min): 99 % de velocidad (mediana; 32 de 39 tramos de 5 s
; al 95 % o más) con ~36 cuadros del juego por segundo, y la generación de cuadros completa los que faltan. Al 36 %
; (2026-10-18) iba a ~41 cuadros, pero al 88 % de velocidad.
EECycleRate = -6

[Forja]
; Generación de cuadros en "Sí" (2026-10-21; apagada de fábrica desde la compilación 59). Con el juego a 25-30 cuadros por
; segundo agrega uno entre cada par: es lo que lo hace "súper fluido". Pesa en la gráfica: en una PS4 normal o Slim, si va
; lento, apágala en L3+R3 > Imagen. Los cierres de este juego del 2026-10-19 eran del guardado de la caché de la gráfica
; (arreglado en la compilación 59), no de la generación de cuadros.
FrameGen = 1
; Plan B: EE, VU1 y GS en los núcleos 1, 2 y 3. En las peleas, 69 % contra 55 % con el reparto normal.
Nucleos = EE=1 VU1=2 GS=3 AUDIO=5 AYUDANTES=4
; CPU automático apagado (2026-10-21; antes bajaba hasta el 27 %): el juego ya empieza en el 27 %, el paso más bajo.
CpuAuto = 0
; Saltar cuadros apagado (2026-10-21): en este juego el límite es el VU1, no el GS, y en Auto se veía mal.
SaltarCuadros = 0
; Modo video Auto (compilación 49): en los videos sube solo la CPU de la PS2 a lo que hace falta. Medido el 2026-10-21:
; al 44 % los videos salen con sus 25 imágenes de 25 y al 100 % de velocidad.
VideoMode = 2

[Patches]
; Saltar cinemáticas con cualquier botón: "Skip Cutscenes", del archivo de la comunidad que Forja baja al empezar el juego.
; Menos efectos 1 y 2 (compilación 44): medidos uno por uno en el Coloso, primera fase, el 2026-10-18: con los dos, 97 % de
; velocidad aun a 3x, lo más rápido que se probó; el 3 y el 4 no sumaron más. Quitan algunos efectos visuales: se apagan en
; L3+R3 > Extras. Si tu perfil tiene su propia lista de parches, manda la tuya.
Enable = Skip Cutscenes
Enable = Menos efectos 1 (Sony)
Enable = Menos efectos 2 (Sony)
