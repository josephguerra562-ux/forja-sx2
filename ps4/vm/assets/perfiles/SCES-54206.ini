; Forja SX2 - perfil de fábrica: God of War II (PAL, SCES-54206).
; Medido en una PS4 Pro con el Modo optimizado (octubre de 2026). Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; El GameDB apaga este atajo del VU1 (mvuFlag: 0) porque en PC algunos ataques salían como cuadrados. En la PS4 no se
; vieron, y con él las peleas pasaron del 51 % al 61 % de velocidad.
vuFlagHack = true
; CPU de la PS2 al 27 % (compilación 37). Medido el 2026-10-17: 98 % de velocidad media y el 83 % del tiempo a velocidad
; completa, contra ~70 % en las peleas al 100 %. El juego calcula su movimiento por tiempo: dibuja entre 25 y 50 cuadros
; por segundo, pero no va en cámara lenta. Si quieres cada cuadro del juego (más lento en las peleas), súbelo en L3+R3.
EECycleRate = -6

[Forja]
; Generación de cuadros "Fluida" (compilación 40): este juego PAL hace 50 cuadros y la PS4 manda la imagen a 60 Hz (no deja
; poner 50). Rellena con un cuadro generado cada refresco en que la tele repetiría uno.
FrameGen = 2
; Plan B: EE, VU1 y GS en los núcleos 1, 2 y 3. En las peleas, 69 % contra 55 % con el reparto normal.
Nucleos = EE=1 VU1=2 GS=3 AUDIO=5 AYUDANTES=4
; CPU automático: apagado. Medido el 2026-10-17: en las peleas más pesadas el juego fue igual (~70 %) con el CPU de la PS2 al
; 50, 60, 75 y 100 %, porque su lógica cabe de sobra y el VU1 hace el mismo trabajo por cuadro. Lo que sirvió es el 27 % fijo.
CpuAuto = 0

[Patches]
; Saltar cinemáticas con cualquier botón: "Skip Cutscenes", del archivo de la comunidad que Forja baja al empezar el juego.
; Menos efectos 1 y 2 (compilación 44): medidos uno por uno en el Coloso, primera fase, el 2026-10-18: con los dos, 97 % de
; velocidad aun a 3x, lo más rápido que se probó; el 3 y el 4 no sumaron más. Quitan algunos efectos visuales: se apagan en
; L3+R3 > Extras. Si tu perfil tiene su propia lista de parches, manda la tuya.
Enable = Skip Cutscenes
Enable = Menos efectos 1 (Sony)
Enable = Menos efectos 2 (Sony)
