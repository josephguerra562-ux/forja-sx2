; Forja SX2 - perfil de fábrica: God of War II (PAL, SCES-54206).
; Medido en una PS4 Pro con el Modo optimizado (octubre de 2026). Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; 2026-10-21: la configuración de Joseph con la que el juego fue al 100 % de velocidad y "súper fluido" en su PS4 Pro
; (v1.05, compilación 69, a 2x): CPU de la PS2 al 27 % fijo, generación de cuadros en "Sí", Plan B y Saltar cuadros apagado.

[EmuCore/Speedhacks]
; El GameDB apaga este atajo del VU1 (mvuFlag: 0) porque en PC algunos ataques salían como cuadrados. En la PS4 no se
; vieron, y con él las peleas pasaron del 51 % al 61 % de velocidad.
vuFlagHack = true
; CPU de la PS2 al 27 % (2026-10-21; antes 36 %). El juego calcula su movimiento por tiempo: con menos CPU dibuja menos
; cuadros, pero va a su velocidad real. Jugando el 2026-10-21 (3 min): 99 % de velocidad (mediana; 32 de 39 tramos de 5 s
; al 95 % o más) con ~36 cuadros del juego por segundo, y la generación de cuadros completa los que faltan. Al 36 %
; (2026-10-18) iba a ~41 cuadros, pero al 88 % de velocidad.
; 2026-11-18 (compilación 146): al 100 %. Con el salto de ciclo "Al vuelo" (desde la 135) el salto le quita el trabajo al EE y la CPU
; baja ya no hace falta: en la misma pelea de la 143, 35,1 FPS al 100 % contra 33,5 al 57 %; en el tablero, 31-33 FPS al 27 % (115-117)
; y 35-37 al 100 % (135-143), todo al 97-100 % de velocidad. El CPU automático la baja si una escena lo pide.
; Base (la 145 en la app): quitado "EECycleRate = 0"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)

[Forja]
; La 146 de la app: "Al vuelo cuida los cuadros". Una subida del salto de ciclo que parte los cuadros del juego vuelve atrás
; (Downhill a 1x, la 145: cada subida a 40-48 dieciseisavos bajaba los cuadros de 50 a 25-36 para salvar menos de 2 % de
; velocidad). Simulado con las trazas de la consola: God of War II 38,9 -> 44,0 cuadros/s, Downhill sin los saltos 50/25.
SaltoCuidaCuadros = 1
; La 154 de la app: "Techo del salto". Al vuelo no pasa de 1,5 saltos (24 dieciseisavos). El salto suma al reloj del EE los ciclos de cada
; programa del VU1, y con 2,3 saltos (donde Al vuelo se quedaba con la 153) eso es ~85 % del tiempo de cada cuadro: el cuadro duraba 1,5
; refrescos (33 FPS) sin ningún hilo lleno. Al vuelo subía por cada refresco perdido, pero este juego pierde ~1 % con cualquier salto
; (940 tramos de 44 partidas). Con 1,5 saltos el juego avanzaba ~37 % más rápido a la misma velocidad. Simulado: 33,5 -> ~42 cuadros en
; lo pesado (simular_techo_salto.py). Si se pone en cámara lenta (10 de 50 refrescos perdidos) el techo se levanta 10 s.
; /data/ForjaSX2/vm-salto-sin-techo lo apaga.
; La 155: 1,25 saltos (20). Con la 154 el salto se quedó en 1,5 todo el tiempo y cada cuadro duraba ~1,24 refrescos de la PS2 (~40
; cuadros): con el GS libre, el salto de 1,5 vuelve a ser el freno. Simulado (la partida de la 154): techo 1,5 -> 40, 1,25 -> 43.
SaltoTecho = 20
; La 164: el techo ya no se levanta por el tirón de cargar una partida (15 s de gracia) ni justo al volver a bajar (10 s), y cada
; levantamiento dura 10 o 20 s (antes se doblaba: 10, 20, 40, 80, 160 s). La 161-163 pasaban la mayor parte del Coloso sobre el techo.
; La 154 de la app: "Flip en su propio hilo". La llamada que manda el cuadro a la pantalla (sceGnmSubmitAndFlipCommandBuffers, dentro
; de ac_ps4_submit_flip) vuelve recién cuando la gráfica termina el cuadro: a 2x el hilo del GS pasaba ahí ~30 % de su tiempo (~10 ms por
; cuadro) y era el freno (~34 cuadros, sin un momento libre). Ahora esa llamada la hace un hilo propio y el GS sigue con el cuadro
; siguiente, sin atrasar la imagen. /data/ForjaSX2/vm-flip-sin-hilo lo apaga.
; La 155: 2, "Flip sin candado". La 154 en la PS4 (2026-11-20): 33,5 -> ~39,5 cuadros, pero ese flip por la GPU retiene el candado del
; controlador ~9,4 ms y el GS seguía esperando ~20 % detrás de él (la gráfica, ocupada solo 37 %). Ahora el hilo espera a que la gráfica
; termine el cuadro y lo manda a la pantalla por la CPU, sin retener el candado. vm-flip-hilo-gpu vuelve a lo de la 154.
FlipEnHilo = 2
; La 157 de la app: "Registros entre bloques" del VU1. Con la 155-156 el VU1 es el freno (96-117 %, el GS lo espera 16-38 %), y en sus
; bloques más calientes el 21 % del código era guardar y volver a cargar registros entre un bloque y el siguiente. Ahora, en un salto
; directo, los registros VF enteros y los VI pasan al bloque siguiente sin guardarse ni cargarse. /data/ForjaSX2/vm-vu1-regs-no lo apaga.
; La 158: apagado. La 157 en la PS4 (2026-11-21): se vio bien pero bajó de ~42 a ~38 cuadros. Los bucles calientes no usaban las
; variantes con registros (las 6 plazas de cada bloque se llenaban con caminos raros) y el código del VU1 pasó de 3,1 a 8,0 MB.
VU1RegistrosEntreBloques = 0
; La 158 de la app: "Tres operandos". Antes de cada cuenta el VU1 copiaba un registro a otro (9 copias en 152 instrucciones en un bloque
; caliente); con AVX la cuenta escribe directo en su registro. /data/ForjaSX2/vm-vu1-3op-no lo apaga.
VU1TresOperandos = 1
; La 158 de la app: "Memoria del VU1 en un registro". La memoria del VU1 está más allá de los 4 GB y cada lectura o escritura cargaba su
; dirección de nuevo (hasta 9 veces en un bloque); ahora se carga una vez por bloque. /data/ForjaSX2/vm-vu1-memreg-no lo apaga.
VU1MemoriaEnRegistro = 1
; La 159 de la app: "Banderas justas". Al final de cada bloque el VU1 calculaba las banderas MAC de sus últimas 4 cuentas por si el
; bloque siguiente las leía; en los bloques más calientes el siguiente lee solo una (mapa de la 157: el código de banderas al final de
; los bloques, del 4,6 % al 1,5 % de lo caliente). /data/ForjaSX2/vm-vu1-banderas-justas-no lo apaga.
VU1BanderasJustas = 1
; La 161 de la app: "Ciclos en una sola cuenta". Cada bloque del VU1 revisaba y descontaba su tiempo con 4 instrucciones y dos lecturas;
; ahora con una resta (los bloques más calientes tienen ~70 instrucciones). /data/ForjaSX2/vm-vu1-cuenta-ciclos-no lo apaga.
VU1CuentaCiclos = 0
; La 164: 0, perdió. Con la misma 163 (2026-11-22, vm-vu1-cuenta-ciclos-no) el VU1 tardaba 7,41 µs por corrida sin ella y 7,89 con ella.
; La 162 de la app: "MAC justa en los saltos". La 161 ya no se trababa, pero bajó de ~43 a ~37 cuadros: con la MAC exacta en los saltos,
; cada bloque antes de un salto calculaba las banderas de sus últimas 4 cuentas. El programa siguiente solo puede leer las que caen
; después del final del anterior, así que bastan las de las 2 últimas. /data/ForjaSX2/vm-vu1-mac-saltos-no lo apaga.
VU1MacEnSaltos = 0
; La 163: 0, la reemplaza "MAC al final". La 162 no subió los cuadros: los bucles calientes seguían calculando una MAC por vuelta.
; La 163 de la app: "MAC al final". La traba del Coloso: los programas 0x08e0 y 0x0b90 leen al empezar la bandera MAC que dejó el
; programa anterior. Ahora cada bloque guarda el resultado de su última cuenta (2 escrituras, en vez de calcular la bandera) y al terminar
; cada programa se calcula una vez la bandera MAC de su última cuenta, como la deja la PS2. /data/ForjaSX2/vm-vu1-mac-final-no lo apaga.
VU1MacAlFinal = 1
; La 151 de la app: "VIF1 en menos turnos". Medido el 2026-11-20 (la 150 con vm-eediag, en lo pesado): el juego le manda al VU1 ~2.100
; programas por cuadro y el EE atendía ~284.000 turnos de la transferencia VIF1 por segundo (~7.900 por cuadro), cada uno con su
; revisión de eventos (el IOP, los contadores, la sincronía del VU): ~3 ms de los ~25 del EE por cuadro pesado. Los pasos que vienen en
; menos de 256 ciclos se hacen en la misma revisión (PCSX2 ya lo hace bajo 4); solo los pasos que movieron datos, nunca una espera,
; y nunca cuando le toca a un contador (el refresco) o al IOP: esos llegan cuando llegaban (simular_vif1_turnos.py).
; Simulado (simular_gow_50.py): de 35,7 a 38-40 cuadros en lo pesado (hasta 44 si el Al vuelo usa el EE que queda libre).
; /data/ForjaSX2/vm-vif-turnos-exactos lo apaga.
; La 153 de la app: hasta 1.024 ciclos. Con la 152 (2026-11-20), de los pasos sin juntar el 32 % pasaba de 256 ciclos (los paquetes
; grandes de vértices); los demás son el IOP, un contador o una espera, que se respetan igual.
VifMenosTurnos = 1024
; La 152 de la app: "Ahorro del VU1". Con la 151 (2026-11-20) en lo pesado el VU1 trabaja el 92-94 %: ~20,6 ms por cuadro de microcódigo
; y ~5,9 ms de lo de alrededor (buscar el programa y el bloque, la zona de trabajo del emisor, el GIF, la cola). El juego sube microcódigo
; ~3.400 veces por segundo y cada subida borraba lo buscado; ahora una subida con los mismos bytes no borra nada, y las corridas del VU1
; usan lo de la versión de PS5 (sin la zona de trabajo en cada corrida, y la última búsqueda recordada). /data/ForjaSX2/vm-vu1-ahorro-no
; lo apaga.
VU1Ahorro = 1
; La 153 de la app: "Banderas muertas del VU1". El mapa del VU1 de la 152 (2026-11-20, vm-vu1-mapa, 386 programas): nada lee ni escribe
; la bandera de estado, y los 53 lectores de la bandera MAC la leen de su propio programa. Así, en un salto calculado (JR/JALR) ninguna
; de las dos hace falta exacta, y el bucle más caliente (transformar vértices, que sale por JALR) deja de calcularlas en cada vuelta: era
; el 28 % de su código. Simulado (simular_vu1_banderas.py): el VU1 1,4-4 ms más barato por cuadro pesado. La de recorte (clip) queda
; exacta. /data/ForjaSX2/vm-vu1-banderas-exactas lo apaga.
VU1BanderasMuertas = 3
; La 163: 3 otra vez (estado y MAC muertas en los saltos, lo rápido de la 160), con "MAC al final" (abajo) para el programa siguiente.
; La 161-162 con 1: sin traba pero de ~43 a ~37 cuadros (los bucles calientes calculaban la MAC por si el bucle salía por un salto).
; La 161: 1 (solo la de estado). La 160 se trabó igual (2026-11-21, cuarta carga): los lectores de 0x08f8 y 0x0b98 están al empezar los
; programas 0x08e0 y 0x0b90 y leen la bandera MAC que dejó el programa anterior, que con la MAC muerta no la calculaba antes de sus saltos.
; Con la MAC exacta en los saltos queda como de la 126 a la 152 (29 cargas, ninguna traba). La de estado no la lee ningún programa.
; La 160: "Banderas muertas seguras". Desde la 153, en el Coloso, a veces justo después de cargar la partida el juego se trababa: un
; programa lee la bandera MAC después de un salto (0x08f8, 0x0b98), le llegaba vieja y el VU1 y el GS quedaban esperándose (153, 155, 158,
; 159; ninguna de la 126 a la 152). Ahora cada programa del VU1 se revisa: si tiene un lector así, ese programa calcula esa bandera en sus
; saltos. Los bucles calientes no tienen ninguno y siguen ahorrando lo mismo.
; Generación de cuadros en "Sí" (2026-10-21; apagada de fábrica desde la compilación 59). Con el juego a 25-30 cuadros por
; segundo agrega uno entre cada par: es lo que lo hace "súper fluido". Pesa en la gráfica: en una PS4 normal o Slim, si va
; lento, apágala en L3+R3 > Imagen. Los cierres de este juego del 2026-10-19 eran del guardado de la caché de la gráfica
; (arreglado en la compilación 59), no de la generación de cuadros.
FrameGen = 1
; Plan B: EE, VU1 y GS en los núcleos 1, 2 y 3. En las peleas, 69 % contra 55 % con el reparto normal.
Nucleos = EE=1 VU1=2 GS=3 AUDIO=5 AYUDANTES=4
; CPU automático apagado (2026-10-21; antes bajaba hasta el 27 %): el juego ya empieza en el 27 %, el paso más bajo.
; Base (la 145 en la app): quitado "CpuAuto = 0"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)
; Saltar cuadros apagado (2026-10-21): en este juego el límite es el VU1, no el GS, y en Auto se veía mal.
; Base (la 145 en la app): quitado "SaltarCuadros = 0"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)
; Modo video Auto (compilación 49): en los videos sube solo la CPU de la PS2 a lo que hace falta. Medido el 2026-10-21:
; al 44 % los videos salen con sus 25 imágenes de 25 y al 100 % de velocidad.
VideoMode = 2
; 2026-11-08 (124-126, una hora en 7 juegos): "Revisión rápida del código" sin un error (Downhill 60 min seguidos).
RevisionRapida = 1

[Patches]
; Saltar cinemáticas con cualquier botón: "Skip Cutscenes", del archivo de la comunidad que Forja baja al empezar el juego.
; Menos efectos 1 y 2 (compilación 44): medidos uno por uno en el Coloso, primera fase, el 2026-10-18: con los dos, 97 % de
; velocidad aun a 3x, lo más rápido que se probó; el 3 y el 4 no sumaron más. Quitan algunos efectos visuales: se apagan en
; L3+R3 > Extras. Si tu perfil tiene su propia lista de parches, manda la tuya.
Enable = Skip Cutscenes
Enable = Menos efectos 1 (Sony)
Enable = Menos efectos 2 (Sony)

[EmuCore/CPU/Recompiler]
; 2026-11-08 (126, "VU1 rápido"): el VU1 sin recorte de números (el atajo de banderas ya estaba). 36 -> 38 FPS de promedio.
vu1Overflow = false
vu1ExtraOverflow = false
vu1SignOverflow = false
