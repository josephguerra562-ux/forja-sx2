; Forja SX2 - perfil de fábrica: God of War II (EE. UU., SCUS-97481).
; Por analogía con la versión PAL (SCES-54206), que es la probada en una PS4 Pro: el mismo motor. Lo que cambies en L3+R3
; le gana a este archivo. Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; El GameDB apaga este atajo del VU1 (mvuFlag: 0); en la PAL no se vieron los cuadrados y las peleas ganaron 51 -> 61 %.
vuFlagHack = true
; CPU de la PS2 al 36 % y CPU automático hasta el 27 % (compilación 46), como en la PAL: ~41 cuadros por segundo en el
; Coloso, y en lo más pesado baja solo al 27 % (el juego calcula su movimiento por tiempo).
EECycleRate = -4

[Forja]
; Generación de cuadros: apagada de fábrica (compilación 59), como en la PAL. Antes: FrameGen = 1 ("Sí": esta versión es
; de 60 Hz y doblaba los tramos estables a 30). Quien quiera, la enciende en L3+R3 > Imagen (compilación 61).
FrameGen = 0
CpuAuto = -6
; Modo video Auto (compilación 49): en los videos busca solo el CPU de la PS2 que hace falta. Medido el 2026-10-18: al 27 %
; los videos salían a 17-21 cuadros (al juego le faltaba CPU para decodificar) y al 60 % a 23 con el 92 % de velocidad (a la
; PS4 le faltaba); el punto justo ronda el 36 %.
VideoMode = 2

[Patches]
; Menos efectos 1 y 2 (compilación 44), como en la PAL: con los dos, 97 % de velocidad en el Coloso. Son las funciones que
; Sony apaga en su propia config de esta versión. Quitan algunos efectos visuales: se apagan en L3+R3 > Extras.
Enable = Menos efectos 1 (Sony)
Enable = Menos efectos 2 (Sony)
