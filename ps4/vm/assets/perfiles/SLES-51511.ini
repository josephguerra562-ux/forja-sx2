; Forja SX2 - perfil de fábrica: Crash Nitro Kart (PAL, SLES-51511).
; Medido en una PS4 Pro el 2026-10-18, con uno y con dos jugadores. Lo que cambies en L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; CPU de la PS2 al 36 % (compilación 47; antes 27 %). Sin parche el juego va a 25 cuadros en carrera a cualquier velocidad
; del CPU. Con "50 FPS (experimental)" (L3+R3 > Extras) necesita más CPU: medido el 2026-10-18, al 27 % llegó a 37-46
; cuadros y al 36 % a 50 con 100 % de velocidad. El CPU automático (de la pestaña Ajustes) lo baja si una carrera pesa.
EECycleRate = -4

[Forja]
; Generación de cuadros "Fluida": este juego PAL hace 25 cuadros en carrera y la PS4 manda la imagen a 60 Hz; rellena cada
; refresco en que la tele repetiría uno. Medido con dos jugadores: 98 % de velocidad, igual que con "Sí".
FrameGen = 2

[Patches]
; "50 FPS (experimental)" de fábrica (compilación 48): probado por Joseph el 2026-10-18, las carreras a 50 cuadros van a
; velocidad normal (el juego calcula su movimiento por tiempo). Se apaga en L3+R3 > Extras; vale desde Partida > Reiniciar.
; Si tu perfil tiene su propia lista de parches, manda la tuya.
Enable = 50 FPS (experimental)
