
; Forja SX2 - perfil de fábrica: Bully (USA, SLUS-21269).
; Medido en una PS4 Pro con el Modo optimizado (2026-11-07, compilación 120) con "Bully (Improved Expert Mod)" (CRC 28703748); el
; Bully sin el mod no se probó. Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Por qué (informes/PRUEBA_C120_2026-11-07.md y simulaciones/simular_techos_cpu.py): con la CPU de la PS2 al 27 % y el FPU exacto
; que pide la GameDB, Bully armaba ~8 cuadros por segundo. El freno era la CPU emulada; el EE de la PS4 iba lleno por el FPU.
; Sin el FPU exacto el EE trabaja 15 % menos, y con ese margen la CPU puede subir: a 31 % se midieron 11,5 FPS (+49 %) con la
; velocidad al 95 % o más el 75 % del tiempo (como venía: 51 %).

[EmuCore/Speedhacks]
; Antes: CPU de la PS2 al 31 % (2026-11-07, 32 tramos de juego): 11,5 FPS con la velocidad al 95 % o más el 75 % del tiempo. Con este
; perfil a 36 % (lo que daba el simulador) se midieron 11,7 FPS pero al 95 % o más solo el 53 %: casi los mismos cuadros y más
; bajones, así que quedó en 31 %.
; Más FPS (~15) se midió a 44 % con el Salto de ciclo Auto y Saltar cuadros Auto, pero un perfil de fábrica no prende
; automáticos: eso queda para el jugador en L3+R3 > Rendimiento.
; 2026-11-08 (127): con "Cargas rápidas del disco" a 44 %: 14,5 FPS y velocidad completa el 90 % (200 s). Los cuadros pasaron de 5-6
; refrescos a 4-5 con menos CPU: lo que marcaba su ritmo era esperar al disco.
EECycleRate = -3
; Lectura rápida del disco solo para Bully (el ajuste general "Cargas rápidas del disco" queda como cada jugador lo tenga).
fastCDVD = true

[EmuCore/CPU/Recompiler]
; FPU exacto apagado (la GameDB lo pide con eeClampMode 3). OJO: en el capítulo 2, para tomar la botella de la vitrina de trofeos
; (la misión "Hattrick vs Galloway"), hay que ponerlo en Sí en L3+R3 > No tocar > "FPU exacto" (desde la compilación 120).
fpuFullMode = false

[Forja]
; Saltar cuadros "1 de 2", como en la partida medida (no es automático). El GS no frena a Bully: solo alivia los picos.
SaltarCuadros = 2
; Escrituras rápidas del IOP: probado en Bully el 2026-11-07, sin fallas; ahorra ~1 % del EE.
IopRapido = 1
; 2026-11-08 (124-126, una hora en 7 juegos): "Revisión rápida del código" sin un error (Downhill 60 min seguidos).
RevisionRapida = 1
