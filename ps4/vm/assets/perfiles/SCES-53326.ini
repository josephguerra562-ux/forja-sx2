; Forja SX2 - perfil de fábrica: Shadow of the Colossus (PAL, SCES-53326).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77). Lo que cambies en L3+R3 le gana a este
; archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Este juego todavía no va completo en la PS4: el GS hace ~2.000 dibujos por cuadro (el pasto, el pelo del coloso) a ~25 µs
; cada uno, y le falta ser ~40 % más barato. La resolución casi no cambia nada (es el CPU de la PS4, no la gráfica).

[EmuCore/Speedhacks]
; CPU de la PS2 al 31 % (lo medido; el juego se juega al 50-85 % de velocidad).
EECycleRate = -5

[Forja]
; Generación de cuadros apagada: le quitaba 5-10 puntos (40-45 % con ella contra 49-51 % sin ella) y se apagaba sola.
FrameGen = 0
; Saltar cuadros apagado: el juego dibuja en un búfer aparte (01c00) y lo copia a la pantalla al final, y Saltar cuadros no
; tiene qué saltar (en la 75 el Auto subió a "1 de 2" sin saltar ni un cuadro).
SaltarCuadros = 0
; Modo video Auto.
VideoMode = 2
