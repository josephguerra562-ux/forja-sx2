; Forja SX2 - perfil de fábrica: Shadow of the Colossus (PAL, SCES-53326).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77). Lo que cambies en L3+R3 le gana a este
; archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Este juego todavía no va completo en la PS4: el GS hace ~2.000 dibujos por cuadro (el pasto, el pelo del coloso) a ~25 µs
; cada uno, y le falta ser ~40 % más barato. La resolución casi no cambia nada (es el CPU de la PS4, no la gráfica).

[EmuCore/Speedhacks]
; Antes: CPU de la PS2 al 31 % (lo medido; el juego se juega al 50-85 % de velocidad).
; 2026-11-08 (124, con la revisión rápida): a 44 % 18,8 FPS y velocidad mediana 96 %; a 57 % 14,8 FPS y 78 %. Lo cerrado lo frena el GS.
; Base (la 145 en la app): quitado "EECycleRate = -3"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)
; La 178 (2026-11-22, simulación de Shadow, informes/SHADOW_30_FPS_2026-11-22.md): en la zona pesada el juego va a velocidad completa
; con el EE de la PS4 esperando el 27 % y dibuja un cuadro cada 6 refrescos (10 FPS): le falta CPU de la PS2. Al 130 % el cuadro puede
; entrar en 5 refrescos (12 FPS) si el GS da (85 ms contra 83). El CPU automático la baja si la velocidad cae.
; La 178 no la aplicó: el tope de la compilación 97 (MAX_EE_CYCLE_RATE = 0) la dejaba en 100 %. Desde la 179 los perfiles de fábrica
; pueden pasar de 100 % (el menú y ajustes.ini siguen hasta 100 %).
EECycleRate = 1

[Forja]
; Generación de cuadros apagada: le quitaba 5-10 puntos (40-45 % con ella contra 49-51 % sin ella) y se apagaba sola.
; La 180 (2026-11-22): de nuevo en Sí para medirla. Hoy Shadow va a velocidad completa con el EE de la PS4 sobrado y la gráfica al ~6 %
; (la generación de cuadros, FSR3, trabaja en la gráfica); en la zona pesada dibuja 10 cuadros: con ella se verían ~20.
; La 180 probada (9 min): PERDIÓ. Con ella no va el "flip sin candado": el GS pasó el 21 % de su tiempo en el fin de cuadro (antes 1 %)
; y la zona pesada bajó de 12 cuadros (la 179) a 8-10; Joseph no vio la pantalla más fluida. Apagada otra vez.
FrameGen = 0
; Saltar cuadros apagado: el juego dibuja en un búfer aparte (01c00) y lo copia a la pantalla al final, y Saltar cuadros no
; tiene qué saltar (en la 75 el Auto subió a "1 de 2" sin saltar ni un cuadro).
; Base (la 145 en la app): quitado "SaltarCuadros = 0"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)
; Modo video Auto.
VideoMode = 2
; 2026-11-08 (124-126, una hora en 7 juegos): "Revisión rápida del código" sin un error (Downhill 60 min seguidos).
RevisionRapida = 1
; 2026-11-07 (122): el IOP de Shadow espera en el bucle de siempre: EE -4 a -6 %.
IopDormido = 1
; La 181 (2026-11-22): "VIF1 en menos turnos" (probada en God of War desde la 151: las revisiones de eventos a la mitad, +1-1,4 cuadros).
; En la zona pesada de Shadow el EE gasta ~27 % de su tiempo en el VIF1 y en revisar eventos (recEventTest ~10 %). Los pasos que vienen
; en menos de 1.024 ciclos se hacen en la misma revisión; nunca una espera, un contador ni el IOP. vm-vif-turnos-exactos la apaga.
VifMenosTurnos = 1024
; La 181: "Vértices una vez" (God of War desde la 173: el mínimo y el máximo de cada dibujo leyendo cada vértice una vez en las tiras
; de triángulos con sombreado suave). Shadow dibuja casi todo con tiras así. Empieza comprobando y se prende sola tras 20.000 dibujos
; iguales; uno distinto la apaga. vm-gs-vertices-no la apaga.
GSVerticesUnaVez = 1
; La 183 (2026-11-22): "A/B en un dibujo" (informes/AB_EN_UN_DIBUJO_PLAN_2026-11-22.md). En la zona pesada ~37.400 dibujos por segundo
; se turnan entre dos texturas T4, una por contexto, y cada una carga su paleta: el dibujo pendiente se cortaba cada vez. Con esto el
; dibujo sigue a través de esas cargas y, si las dos preparaciones coinciden salvo la textura, va como un solo dibujo con las dos
; (medido en la 182: ~9.400 dibujos por segundo, casi 4 veces menos). Si algo no coincide, se dibuja por partes como antes.
; /data/ForjaSX2/vm-gs-ab-no lo apaga; vm-gs-ab-ensayo solo junta y dibuja por partes (para ver si una falla viene del GS o de la gráfica).
GSDibujoAB = 2
