; Forja SX2 - perfil de fábrica: Shadow of the Colossus (PAL, SCES-53326).
; Medido en una PS4 Pro con el Modo Boost el 2026-10-23 (compilaciones 75 y 77). Lo que cambies en L3+R3 le gana a este
; archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.
; Este juego todavía no va completo en la PS4: el GS hace ~2.000 dibujos por cuadro (el pasto, el pelo del coloso) a ~25 µs
; cada uno, y le falta ser ~40 % más barato. La resolución casi no cambia nada (es el CPU de la PS4, no la gráfica).

[EmuCore/Speedhacks]
; Antes: CPU de la PS2 al 31 % (lo medido; el juego se juega al 50-85 % de velocidad).
; 2026-11-08 (124, con la revisión rápida): a 44 % 18,8 FPS y velocidad mediana 96 %; a 57 % 14,8 FPS y 78 %. Lo cerrado lo frena el GS.
; Base (la 145 en la app): quitado "EECycleRate = -3"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)
; La 178 (2026-11-22, simulación de Shadow, informes/SHADOW_30_FPS_2026-11-22.md): en la zona pesada el juego va a velocidad completa
; con el EE de la PS4 esperando el 27 % y dibuja un cuadro cada 6 refrescos (10 FPS): le falta CPU de la PS2. Al 130 % el cuadro puede
; entrar en 5 refrescos (12 FPS) si el GS da (85 ms contra 83). El CPU automático la baja si la velocidad cae.
; La 178 no la aplicó: el tope de la compilación 97 (MAX_EE_CYCLE_RATE = 0) la dejaba en 100 %. Desde la 179 los perfiles de fábrica
; pueden pasar de 100 % (el menú y ajustes.ini siguen hasta 100 %).
EECycleRate = 1
; La 201 (2026-11-22): "Salto de ciclo: No" de fábrica (la base de todos es "Al vuelo"). Prueba de Joseph con la 200, misma zona
; pesada y misma partida: Al vuelo (subió a 34-48/16) 9,3 FPS; No 13,1; 1/2 10,9; 1 10,7; 2 8,5. Shadow espera al VU1 y al GS en cada
; cuadro: cada salto le suma tiempo de PS2 al cuadro (de 4,4 a 5,8 refrescos) y la velocidad igual queda cerca del 100 %.
EECycleSkip = 0
EECycleSkipQuarters = 0
EECycleSkipAuto = 0

[Forja]
; Generación de cuadros apagada: le quitaba 5-10 puntos (40-45 % con ella contra 49-51 % sin ella) y se apagaba sola.
; La 180 (2026-11-22): de nuevo en Sí para medirla. Hoy Shadow va a velocidad completa con el EE de la PS4 sobrado y la gráfica al ~6 %
; (la generación de cuadros, FSR3, trabaja en la gráfica); en la zona pesada dibuja 10 cuadros: con ella se verían ~20.
; La 180 probada (9 min): PERDIÓ. Con ella no va el "flip sin candado": el GS pasó el 21 % de su tiempo en el fin de cuadro (antes 1 %)
; y la zona pesada bajó de 12 cuadros (la 179) a 8-10; Joseph no vio la pantalla más fluida. Apagada otra vez.
FrameGen = 0
; Saltar cuadros apagado: el juego dibuja en un búfer aparte (01c00) y lo copia a la pantalla al final, y Saltar cuadros no
; tiene qué saltar (en la 75 el Auto subió a "1 de 2" sin saltar ni un cuadro).
; Base (la 145 en la app): quitado "SaltarCuadros = 0"; vale la base para todos (CPU 100 % con el automático, salto y Saltar cuadros Al vuelo)
; Modo video Auto.
VideoMode = 2
; 2026-11-08 (124-126, una hora en 7 juegos): "Revisión rápida del código" sin un error (Downhill 60 min seguidos).
RevisionRapida = 1
; 2026-11-07 (122): el IOP de Shadow espera en el bucle de siempre: EE -4 a -6 %.
IopDormido = 1
; La 181 (2026-11-22): "VIF1 en menos turnos" (probada en God of War desde la 151: las revisiones de eventos a la mitad, +1-1,4 cuadros).
; En la zona pesada de Shadow el EE gasta ~27 % de su tiempo en el VIF1 y en revisar eventos (recEventTest ~10 %). Los pasos que vienen
; en menos de 1.024 ciclos se hacen en la misma revisión; nunca una espera, un contador ni el IOP. vm-vif-turnos-exactos la apaga.
VifMenosTurnos = 1024
; La 208 (2026-11-25): "Cortes del VIF1 juntos". El medidor de la 207: ~75.000 de las ~204.000 pruebas de evento por segundo eran
; pasos del VIF1 después de un corte de tiempo (el de cada DIRECT entero, ~68.000 por segundo). Ahora se juntan como los demás pasos
; (nunca una espera de la GIF, del VU1 ni de una interrupción). vm-vif-cortes-separados la apaga.
VifCortesJuntos = 1
; La 208: "Ahorro del VU1" (de God of War II desde la 152, "se ve bien"): cada programa del VU1 arranca sin rearmar el emisor y con
; la caché de búsqueda. Shadow corre ~280.000 programas por segundo (el 05b0 ~147.000, de ~410 ciclos cada uno). vm-vu1-ahorro-no la apaga.
VU1Ahorro = 1
; La 181: "Vértices una vez" (God of War desde la 173: el mínimo y el máximo de cada dibujo leyendo cada vértice una vez en las tiras
; de triángulos con sombreado suave). Shadow dibuja casi todo con tiras así. Empieza comprobando y se prende sola tras 20.000 dibujos
; iguales; uno distinto la apaga. vm-gs-vertices-no la apaga.
GSVerticesUnaVez = 1
; La 183 (2026-11-22): "A/B en un dibujo" (informes/AB_EN_UN_DIBUJO_PLAN_2026-11-22.md). En la zona pesada ~37.400 dibujos por segundo
; se turnan entre dos texturas T4, una por contexto, y cada una carga su paleta: el dibujo pendiente se cortaba cada vez. Con esto el
; dibujo sigue a través de esas cargas y, si las dos preparaciones coinciden salvo la textura, va como un solo dibujo con las dos
; (medido en la 182: ~9.400 dibujos por segundo, casi 4 veces menos). Si algo no coincide, se dibuja por partes como antes.
; /data/ForjaSX2/vm-gs-ab-no lo apaga; vm-gs-ab-ensayo solo junta y dibuja por partes (para ver si una falla viene del GS o de la gráfica).
; La 188: 3 = también los dibujos con la segunda pasada de alfa (AFAIL FB_ONLY: color primero, profundidad después), que en la
; zona pesada son la mayoría (pelaje, pasto). PCSX2 ya hace esa aproximación dentro de cada dibujo; juntados, abarca más triángulos
; que se pisan. 2 = solo lo exacto.
GSDibujoAB = 3
; La 194 (2026-11-22): "Aviso al VU1 por pedazo". La 193 midió que los pedazos del VIF1 que solo alimentan al VU1 se llevan ~30 % del
; EE (~440.000 por segundo, ~5 códigos cada uno) y que cada paquete (más de un millón por segundo) le avisaba al hilo del VU1 con una
; operación atómica sobre una línea que ese hilo también toca. Con esto el aviso va una vez por pedazo (lo hizo el port de PS5; en Forja
; estaba sin conectar). vm-vu1-aviso-cada-paquete lo apaga.
VU1AvisoPorPedazo = 1
; La 195 (2026-11-22): "VIF en su hilo" (informes/VIF_HILO_PROPIO_PLAN_2026-11-22.md). Los pedazos del VIF1 que solo alimentan al VU1
; (~440.000 por segundo, ~30 % del EE en la zona pesada) los recorre otro hilo (núcleo 4, el de los ayudantes); los códigos difíciles
; (DIRECT, FLUSH, MSCALF...) siguen en el EE. vm-vif-hilo-no lo apaga.
; La 200 (2026-11-22): apagado otra vez. Del 195 al 199 quedó estable y correcto, pero Shadow lee el VIF1 en un bucle hasta que termina,
; en cada cuadro: el EE esperaba al hilo 16-25 % de su tiempo y el hilo trabajaba ~25 %, sin trabajo a la par (6-10 FPS contra 14-16).
VifHilo = 0
; La 205 (2026-11-23): "Eventos sin prisa". vm-eediag con la 204: el juego llama ~57.000 veces por segundo a WaitSema/SignalSema y
; ~43.000 a GetThreadId; cada EI y cada ERET pedían una prueba de evento 4 ciclos después (con su vuelta del IOP), ~380.000 por
; segundo. Con esto solo la piden si de verdad hay una interrupción o el VU0 esperando. vm-eventos-con-prisa lo apaga.
; La 206 (2026-11-24): la 205 no bajó las pruebas de evento (~404.000 por segundo, igual que la 203 y la 204) porque el traductor
; del EE forzaba una al final del bloque de cada ERET y cada EI antes de llegar a lo de la 205. Ahora ese forzado también depende de esto.
; La 207 (2026-11-25): el medidor de la 206 mostró que la mitad (~200.000 por segundo) las pedía WriteCP0Status (el núcleo de la
; PS2 escribe Status dos veces por llamada al sistema); ahora ese pedido también depende de esto.
EventosSinPrisa = 1
; La 191 (2026-11-22): "VIF en tramos" (la 167; en God of War empató). Con A/B el freno de Shadow pasó a ser el EE; el medidor del
; EE (vm-eediag, la 190) en la zona pesada: ~845.000 UNPACK, ~698.000 NOP, ~347.000 STMOD, ~90.000 STCYCL y ~312.000 programas del VU1
; por segundo: miles de paquetes chicos por cuadro (God of War: ~450.000 UNPACK). Los códigos que solo le sirven al VU1 van de una vez.
; Empieza comprobando y se prende sola tras 100.000 bien; uno mal la apaga. vm-vif-tramos-no la apaga.
; La 191 probada (2026-11-22, 6 min 30 s): EMPATÓ. Se prendió (modo directo, 0 mal), pero la zona pesada quedó igual (14,7 contra 14,8
; cuadros), el VIF del EE 21,0 % contra 21,7 %, y el hilo del VU1 subió de 71 a 78 %. Lo caro es mover los datos. Apagada.
VifEnTramos = 0
; La 192 (2026-11-22): "VIF sin copia" (la 175-177; en God of War perdió porque ese juego reescribe sus paquetes). El EE de Shadow gasta
; ~8 % copiando los datos de cada UNPACK a la cola del VU1 (VifUnpack, memcpy, ReserveSpace) y el hilo del VU1 está ocupado ~67 %: con
; esto el VU1 lee los datos directo de la RAM del juego. Aprende por página de 4 KB (256 iguales: sin copia; una distinta: copia para
; siempre; 8 fallas tardías: solo aprende). vm-vif-sincopia-no la apaga.
; La 192 probada (2026-11-22, 6 min 20 s): segura en Shadow (0 mal, 0 fallas tardías, 1.134 páginas, 96,7 % de los bytes de la RAM),
; pero EMPATÓ: el VIF del EE 21,7 → 20,1 %, la zona pesada 14,0 cuadros (la 190: 14,8). Los UNPACK de Shadow son diminutos (~52
; bytes): copiar no cuesta; lo caro es atender cada código. Apagada.
VifSinCopia = 0
