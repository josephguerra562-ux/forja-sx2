; Forja SX2 - perfil de fábrica: Pro Evolution Soccer 6 (PAL) (SLES-54360).
; SIN MEDIR con estos valores (compilación 97). Viene de los resúmenes de Joseph del 2026-10-30 (compilación 95, PS4 Slim,
; sistema 12.00: PES6 Absolute Patch y WE8), que son el mismo motor de fútbol. Lo que cambies en L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; CPU de la PS2 al 27 %: en los partidos el EE frenó el 90-98 % del tiempo (velocidad 70-76 %, CPU ya al 31-36 %), con GS y
; VU1 sin frenar nada, y le faltaba ser 23-30 % más barato. El 27 % es el paso más bajo que hay.
EECycleRate = -6

[Forja]
; CPU automático apagado: el juego ya empieza en el paso más bajo.
CpuAuto = 0
; Generación de cuadros apagada: en un juego a 50 cuadros se apagaba sola porque costaba velocidad.
FrameGen = 0
; Plan B: EE, VU1 y GS en los núcleos 1, 2 y 3, el EE sin nadie al lado.
Nucleos = EE=1 VU1=2 GS=3 AUDIO=5 AYUDANTES=4
; Saltar cuadros apagado: el límite es el EE, no el GS; saltar cuadros no lo ayuda.
SaltarCuadros = 0
