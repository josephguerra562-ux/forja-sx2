; Forja SX2 - perfil de fábrica: Tales of the Abyss (USA, SLUS-21386).
; Medido en una PS4 Pro con el Modo optimizado (octubre de 2026). Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; CPU de la PS2 al 100 %: así el juego normal va al 93-100 % de velocidad.
EECycleRate = 0

[Forja]
; Cinemáticas en Modo video Auto empezando al 50 % (compilación 65). Medido el 2026-10-20 (PS4 Pro): al 60 % iban al 77-85 %
; de velocidad (cámara lenta, con el hilo del EE de la PS4 lleno), al 50 % al 89-93 % y al 36 % al 98-104 %, con 20-23
; imágenes por segundo. El Auto baja al 36 % si hace falta. (En octubre, con una compilación vieja, al 50 % la música se
; cortaba; hoy los cortes salen al cambiar de velocidad, no por ir al 36 o al 50 %.)
VideoMode = 2
VideoEECycleRate = -3
; Reparto normal de núcleos: con el Plan B el juego normal bajó del 95 % al 87 % (una sola medición).
Nucleos = EE=2 VU1=3 GS=4 AUDIO=5
