; Forja SX2 - perfil de fábrica: Tales of the Abyss (USA, SLUS-21386).
; Medido en una PS4 Pro con el Modo optimizado (octubre de 2026). Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; CPU de la PS2 al 100 %: así el juego normal va al 93-100 % de velocidad.
EECycleRate = 0

[Forja]
; Cinemáticas en Modo video Auto empezando al 60 % (compilación 68). Medido el 2026-10-20 (PS4 Pro, compilaciones 65-67): al
; 36 % iban al 100 % de velocidad con 19-22 imágenes de 30 y el sonido con ~2 cortes por segundo; al 50 % al 95 % con 24-26
; y ~1 corte por segundo; al 60 % al 82 % con las 30 imágenes, que es cuando el reproductor alcanza a dar también el sonido.
; El Auto no baja de ahí mientras al video le falten imágenes.
VideoMode = 2
VideoEECycleRate = -2
; Reparto normal de núcleos: con el Plan B el juego normal bajó del 95 % al 87 % (una sola medición).
Nucleos = EE=2 VU1=3 GS=4 AUDIO=5
