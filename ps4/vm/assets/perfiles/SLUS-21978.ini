; Saltar cuadros (GS) en Auto (compilación 47): en las peleas el juego manda ~2.100 dibujos por cuadro y el GS de la PS4
; tarda ~31 ms por refresco en ellos: iba al 48 % de velocidad, en cámara lenta. Cuando eso pasa, el GS dibuja 1 de cada 2
; cuadros y el juego vuelve a su velocidad, con menos cuadros en pantalla. Se apaga solo cuando sobra GS.
