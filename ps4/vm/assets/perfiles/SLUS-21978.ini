; Forja SX2 - perfil de fábrica: Dragon Ball Z Budokai Tenkaichi 4 (mod de fans del Tenkaichi 3, SLUS-21978).
; Medido en una PS4 Pro el 2026-10-18. Lo que cambies en L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[Forja]
; Huella "Menos efectos: sombreado de personajes" encendida de fábrica (compilación 63, pedido de Joseph: que los ajustes
; recomendados la traigan). Quita la capa de sombras y brillos de la ropa: se ve con menos detalle, pero las peleas pasan
; de ~45 % a 80-100 % de velocidad (PS4 Pro, 2026-10-20). Se apaga en L3+R3 > Extras > Parche.
Huellas = sombreado_personajes
; Generación de cuadros apagada de fábrica (2026-10-21): aquí el límite es el GS, y mientras genera, las peleas van 10-15
; puntos más lentas (a 2x con la huella: 67-70 % generando contra 75-84 % en pausa; con "1 de 2" a 3x, 79 % contra 94 %), y
; se prendía y apagaba cada 10-40 s. Apagada, el Auto de Saltar cuadros (1.06) puede trabajar. Se prende en L3+R3 > Imagen.
FrameGen = 0
; Saltar cuadros (GS) en Auto de fábrica desde la 1.06 (2026-10-21, pedido de Joseph). Con la huella las peleas van a
; 81-88 %, con el GS como límite; en la 73 el Auto con el guardián las llevó al 100 % a 30 cuadros, y el guardián solo se
; pausó 2 veces, al terminar una pelea (sin parpadeo en el menú de pausa ni en la victoria). Se cambia en L3+R3 > Rendimiento.
; (En la 47 venía en Auto y congelaba la imagen; en la 48 salía blanca y pixelada: la 62 lo rehízo y la 73 le puso el guardián.)
; Dos claves: las versiones anteriores a la 1.06 bajan este archivo de main y solo leen SaltarCuadros, y su Auto no tiene el
; guardián (parpadea en el menú de pausa y en la victoria): para ellas sigue en No. La 1.06 lee SaltarCuadrosConGuardian.
SaltarCuadros = 0
SaltarCuadrosConGuardian = 1
; Filtro VU1 (2026-10-18, compilación 50): quitar el programa 0318 no cambió nada, ni en la imagen ni en el GS (siguieron los
; ~2.150 dibujos por cuadro y ~31 ms por refresco): ese programa no dibuja. Por eso no viene quitado. Lo que frena este juego
; es el GS: en la 51 está el Filtro GS (L3+R3 > Extras) para buscar qué grupo de dibujos se puede quitar sin que se note.
