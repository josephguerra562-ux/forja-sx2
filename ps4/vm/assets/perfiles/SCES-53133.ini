; Forja SX2 - perfil de fábrica: God of War (PAL, SCES-53133).
; Adaptado el 2026-10-30 del perfil de God of War II PAL (SCES-54206), el mismo motor. SIN MEDIR en God of War 1: nadie lo
; ha jugado todavía en Forja con estos ajustes. Lo que cambies en el menú L3+R3 le gana a este archivo.
; Comentarios solo en su propia línea: el lector de .ini de PCSX2 no acepta comentarios al final.

[EmuCore/Speedhacks]
; CPU de la PS2 al 27 %, como God of War II: el juego calcula su movimiento por tiempo, así que con menos CPU dibuja menos
; cuadros, pero va a su velocidad real. God of War II no lleva aquí el atajo del VU1 porque en este juego la base de datos
; de PCSX2 no lo apaga: ya viene prendido.
EECycleRate = -6

[Forja]
; Generación de cuadros en "Sí", como God of War II: agrega un cuadro entre cada par. Pesa en la gráfica: en una PS4 normal
; o Slim, si va lento, apágala en L3+R3 > Imagen.
FrameGen = 1
; Plan B: EE, VU1 y GS en los núcleos 1, 2 y 3. En las peleas de God of War II, 69 % contra 55 % con el reparto normal.
Nucleos = EE=1 VU1=2 GS=3 AUDIO=5 AYUDANTES=4
; CPU automático apagado: el juego ya empieza en el 27 %, el paso más bajo.
CpuAuto = 0
; Saltar cuadros apagado: en God of War II el límite es el VU1, no el GS, y en Auto se veía mal.
SaltarCuadros = 0
; Modo video Auto: en los videos sube solo la CPU de la PS2 a lo que hace falta.
VideoMode = 2

[Patches]
; Saltar cinemáticas con cualquier botón: "Skip Cutscenes", del archivo de la comunidad que Forja baja al empezar el juego.
; Menos efectos A y B: lo que Sony apaga en este mismo juego. Buscan la función por su contenido: si en tu versión no es
; idéntica, no pasa nada. Quitan algunos efectos visuales: se apagan en L3+R3 > Extras.
Enable = Skip Cutscenes
Enable = Menos efectos A (Sony)
Enable = Menos efectos B (Sony)
