name: Build PS4SX2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - 'tools/ps4-live-monitor/**'

permissions:
  contents: read

concurrency:
  group: ps4-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the release URL and checksum paired when updating the SDK snapshot.
  PS4_SDK_URL: ${{ vars.PS4_SDK_URL || 'https://github.com/Phoenixx1202/PS4SX2-SDK/releases/download/sdk-v1/ps4sx2-sdk-v1.tar.gz' }}
  PS4_SDK_SHA256: ${{ vars.PS4_SDK_SHA256 || '3e7536f164cee3df2265fb2eff6fccc9e8286f2ab538559e3df0adf95a8ee831' }}

jobs:
  compile:
    name: Compile PS4 executable
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore PS4 SDK
        run: python3 tools/ci/fetch-sdk.py --destination "$RUNNER_TEMP/ps4-sdk" --component linux

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg cmake ninja-build rsync python3 libxml2 libtinfo6 zlib1g
          curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          gpg --dearmor < "$RUNNER_TEMP/llvm.asc" | sudo tee /usr/share/keyrings/llvm-ci.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm-ci.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm-ci.list
          sudo apt-get update
          sudo apt-get install -y clang-21 llvm-21 lld-21

      - name: Compile and generate EBOOT
        run: |
          set -euo pipefail
          mkdir -p ci-output ps4/deps/prefix
          rsync -a "$RUNNER_TEMP/ps4-sdk/linux/prefix/" ps4/deps/prefix/
          export OPENORBIS="$RUNNER_TEMP/ps4-sdk/linux/openorbis"
          export OO_PS4_TOOLCHAIN="$OPENORBIS"
          export PS4_SYSROOT="$RUNNER_TEMP/ps4-sdk/linux/sysroot"
          export PS4_MESA_BUILD="$RUNNER_TEMP/ps4-sdk/linux/mesa"
          export VM_SOURCE_STAGE="$RUNNER_TEMP/ps4sx2-src"
          export VM_BUILD_DIR="$RUNNER_TEMP/ps4sx2-build"
          export PCSX2_VM_JIT=ON PCSX2_VM_FASTMEM=ON PCSX2_VM_MTVU=ON
          chmod +x "$OPENORBIS"/bin/*
          bash ps4/vm/build-wsl.sh 2 2>&1 | tee ci-output/compile.log
          cp ps4/vm/build/{eboot.bin,vm_boot,vm_boot.oelf} ci-output/
          printf 'Commit: %s\nSDK SHA256: %s\n' "$GITHUB_SHA" "$PS4_SDK_SHA256" > ci-output/build-info.txt
          clang-21 --version >> ci-output/build-info.txt

      - name: Upload executable and symbols
        uses: actions/upload-artifact@v7
        with:
          name: ps4-executable-${{ github.run_id }}
          path: |
            ci-output/eboot.bin
            ci-output/vm_boot
            ci-output/vm_boot.oelf
            ci-output/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-logs-${{ github.run_id }}
          path: |
            ci-output/*.log
            ${{ runner.temp }}/ps4sx2-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package PS4SX2
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore packaging SDK
        run: |
          python tools/ci/fetch-sdk.py --destination "$env:RUNNER_TEMP/ps4-sdk" --component windows
          if ($LASTEXITCODE -ne 0) { throw 'SDK preparation failed.' }

      - uses: actions/download-artifact@v8
        with:
          name: ps4-executable-${{ github.run_id }}
          path: ps4/vm/build

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build and validate PKG
        run: |
          New-Item -ItemType Directory -Force ci-output | Out-Null
          & ./ps4/vm/build-package.ps1 -Toolchain "$env:RUNNER_TEMP/ps4-sdk/windows/openorbis" *> ci-output/package.log
          $packages = @(Get-ChildItem ps4/vm/build/package -Filter '*.pkg' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one validated package.' }
          Copy-Item -LiteralPath $packages[0].FullName -Destination ci-output
          Copy-Item ps4/vm/build/build-info.txt ci-output
          $hash = Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($packages[0].Name)" | Set-Content ci-output/SHA256SUMS.txt
          "Built PS4SX2 from commit $env:GITHUB_SHA. Download the PS4SX2-PKG artifact below." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: PS4SX2-PKG-${{ github.run_number }}
          path: |
            ci-output/*.pkg
            ci-output/SHA256SUMS.txt
            ci-output/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-logs-${{ github.run_id }}
          path: ci-output/*.log
          if-no-files-found: ignore
          retention-days: 14
