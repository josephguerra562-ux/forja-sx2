name: Aprobar compilación

# Forja SX2: pasa una pre-release "compilacion-N" que ya probaste en la PS4 a versión normal. El canal estable del
# actualizador (ps4/vm/ReleaseCheck.cpp) lee /releases/latest, que solo ve las versiones normales, así que desde aquí
# la compilación le llega a todos; el canal de pruebas (/data/ForjaSX2/canal-pruebas) ya la veía.
# En la web: Actions > Aprobar compilación > Run workflow, y el número. Sin gh, desde PowerShell con el token del
# administrador de credenciales: POST /repos/josephguerra562-ux/forja-sx2/actions/workflows/aprobar.yml/dispatches
# con {"ref":"main","inputs":{"compilacion":"31"}}.

on:
  workflow_dispatch:
    inputs:
      compilacion:
        description: 'Número de la compilación que ya probaste (por ejemplo 31)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  aprobar:
    name: Pasar al canal estable
    runs-on: ubuntu-24.04
    steps:
      - name: Quitar la marca de pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ inputs.compilacion }}
        run: |
          set -euo pipefail
          if ! [[ "$NUMERO" =~ ^[0-9]+$ ]]; then echo "::error::El número de compilación lleva solo cifras"; exit 1; fi
          tag="compilacion-$NUMERO"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          grep -q '\.pkg$' <<< "$assets" || { echo "::error::$tag no tiene .pkg"; exit 1; }
          grep -qx 'SHA256SUMS.txt' <<< "$assets" || { echo "::error::$tag no tiene SHA256SUMS.txt"; exit 1; }
          # Forja SX2: the stable release is named after its version, from the package's name (ForjaSX2-Emulador-v1.01.pkg).
          version=$(grep -oE 'ForjaSX2-Emulador-v[0-9]+\.[0-9]+\.pkg' <<< "$assets" | sed -E 's/.*-v([0-9.]+)\.pkg/\1/' | head -n1 || true)
          if [ -n "$version" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title "Forja SX2 v$version"
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          fi
          estable=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "Canal estable: $estable"
          echo "Compilación $NUMERO aprobada. El canal estable ofrece ahora: $estable" >> "$GITHUB_STEP_SUMMARY"
          # Forja 1.06: el canal estable baja el centro de ajustes de su versión desde la rama centro-vX.YY
          # (ps4/vm/PatchDownload.cpp). Se crea aquí en el commit de la compilación aprobada. Si ya existe (otra compilación
          # de la misma versión), solo se adelanta cuando no tiene arreglos propios; si los tiene, queda como está y avisa.
          if [ -z "$version" ]; then
            echo "Sin versión en el nombre del paquete: no hay rama del centro de ajustes"
            exit 0
          fi
          rama="centro-v$version"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')
          if gh api "repos/$GITHUB_REPOSITORY/branches/$rama" --silent 2>/dev/null; then
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$rama" -f sha="$sha" -F force=false --silent; then
              echo "Centro de ajustes: rama $rama adelantada a $sha" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::La rama $rama tiene arreglos propios y no se tocó: revisa a mano si le falta algo de la $NUMERO"
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$rama" -f sha="$sha" --silent
            echo "Centro de ajustes: rama $rama creada en $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
